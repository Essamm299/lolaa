<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Lolty ❤️</title>
    <!-- استدعاء خطوط جوجل الأنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* التنسيقات الأساسية والخلفية */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0a14 0%, #4a0e2e 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* حاوية الشاشات لسهولة التحكم في الانتقال */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        /* شاشة الدخول */
        #login-screen {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        #login-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* شاشة المفاجأة (القلب والصورة) */
        #reveal-screen {
            opacity: 0;
            visibility: hidden;
            z-index: 5;
            pointer-events: none;
        }

        #reveal-screen.visible {
            opacity: 1;
            visibility: visible;
            z-index: 20;
            pointer-events: auto;
        }

        /* صندوق تسجيل الدخول الزجاجي (Glassmorphism) */
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 380px;
        }

        .login-box h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #ffb3c6;
        }

        /* حقل الإدخال */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            transition: background 0.3s, box-shadow 0.3s;
            text-align: center;
            letter-spacing: 3px;
        }

        input[type="password"]:focus, input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 46, 99, 0.4);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: normal;
        }

        /* زر الدخول */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff2e63, #e80033);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 46, 99, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* رسالة الخطأ */
        #error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: 600;
        }

        /* أنيميشن الاهتزاز عند الخطأ */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* تصميم عناصر شاشة المفاجأة */
        .reveal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* القلب النابض */
        .heart-svg {
            width: 80px;
            height: 80px;
            margin: 10px 0;
            filter: drop-shadow(0 0 20px rgba(255, 0, 64, 0.7));
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* النص الرومانسي */
        .romantic-text {
            font-family: 'Cairo', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 1px 1px 15px rgba(255, 46, 99, 0.6);
            margin: 20px 20px 0;
            line-height: 1.8;
            font-weight: 600;
            max-width: 650px;
        }

        .romantic-text p {
            margin-bottom: 15px;
        }

        .romantic-text p:last-child {
            font-size: 2.2rem;
            color: #ffb3c6;
            font-weight: 700;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .romantic-text {
                font-size: 1.1rem;
                margin: 15px 15px 0;
            }
            .romantic-text p:last-child {
                font-size: 1.8rem;
            }
        }

        /* أنيميشن نبض القلب */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <div class="login-box" id="login-box">
            <h1>Our Secret</h1>
            <div class="input-group">
                <!-- خليت نوع الإدخال text عشان لو حبيت تظهر الباسورد كنص، أو ممكن ترجعه password -->
                <input type="password" id="password-input" placeholder="Enter PIN..." autocomplete="off">
            </div>
            <button id="login-btn">Unlock ❤️</button>
            <div id="error-msg">Incorrect PIN, try again.</div>
        </div>
    </div>

    <!-- الشاشة الثانية: شاشة الظهور (الصورة، القلب، النص) -->
    <div id="reveal-screen" class="screen">
        <div class="reveal-content">
            
            <!-- الصورة كما طلبتها بالضبط -->
            <img src="325309.png" alt="Us" style="width: 250px; border-radius: 20px; box-shadow: 0 10px 20px rgba(255,105,180,0.5); margin-bottom: 20px;">
            
            <!-- القلب النابض -->
            <svg class="heart-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z" fill="#ff2e63"/>
            </svg>

            <!-- الكلمة الرومانسية -->
            <div class="romantic-text" dir="rtl">
                <p>مهما قولت وحاولت احكي عمري ما هوافيكي حقك يا احلى واغلى حاجه ف حياتي، قيمتك عارفها من زمان وعرفتها اكتر لما زعلتك وحسيت اني ممكن اخسرك.</p>
                <p>وعد مني يالولتي مش هزعلك تاني معايا وهعوضك عن اي حاجه.</p>
                <p>بحبك يعمري ❤️</p>
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('login-btn');
            const passwordInput = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const loginScreen = document.getElementById('login-screen');
            const revealScreen = document.getElementById('reveal-screen');
            const loginBox = document.getElementById('login-box');

            function checkPassword() {
                const pass = passwordInput.value.trim();
                
                // التحقق من الباسورد المطلوب
                if (pass === '244299') {
                    // إخفاء شاشة الدخول
                    loginScreen.classList.add('hidden');
                    
                    // إظهار شاشة المفاجأة بعد انتهاء تأثير الإخفاء (1 ثانية)
                    setTimeout(() => {
                        revealScreen.classList.add('visible');
                    }, 800); 
                } else {
                    // إظهار رسالة الخطأ
                    errorMsg.style.opacity = '1';
                    
                    // إضافة تأثير الاهتزاز
                    loginBox.classList.remove('shake');
                    // خدعة برمجية لإجبار المتصفح على إعادة تشغيل الأنيميشن (Trigger Reflow)
                    void loginBox.offsetWidth; 
                    loginBox.classList.add('shake');
                }
            }

            // تفعيل التحقق عند ضغط الزر
            loginBtn.addEventListener('click', checkPassword);

            // تفعيل التحقق عند ضغط زر Enter
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
            
            // إخفاء رسالة الخطأ بمجرد تعديل النص
            passwordInput.addEventListener('input', () => {
                errorMsg.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
